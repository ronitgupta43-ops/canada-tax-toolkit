[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canada-tax-toolkit"
version = "0.4.0"
description = "Ontario take-home pay calculator: federal and Ontario tax, Health Premium, CPP and EI"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ronit Gupta"}]
requires-python = ">=3.9"
keywords = ["tax", "canada", "ontario", "cra", "finance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
