[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canada-tax-toolkit"
version = "0.5.1"
description = "Take-home pay and tax refund calculator for Ontario, BC and Alberta: federal and provincial tax, CPP and EI"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ronit Gupta"}]
requires-python = ">=3.10"
keywords = ["tax", "canada", "ontario", "british-columbia", "alberta", "cra", "finance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
